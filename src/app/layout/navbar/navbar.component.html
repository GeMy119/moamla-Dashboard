<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-6 sticky top-0 z-10">

    <!-- Hamburger (Mobile only) -->
    <button (click)="toggleSidebar.emit()" class="lg:hidden text-gray-600 hover:bg-gray-100 p-2 rounded-lg transition">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <h2 class="text-base md:text-lg font-semibold text-gray-800 hidden sm:block">مرحباً بك 👋</h2>

    <!-- User dropdown -->
    <div class="relative">
        <button (click)="toggleMenu()"
            class="flex items-center gap-2 text-sm font-medium text-gray-700 hover:bg-gray-50 px-2 md:px-3 py-2 rounded-lg transition">
            <div
                class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold text-sm">
                {{ userName.charAt(0) }}
            </div>
            <span class="hidden sm:inline">{{ userName }}</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>

        @if (isMenuOpen) {
        <div class="absolute left-0 mt-2 w-44 bg-white border border-gray-100 rounded-lg shadow-lg py-1 z-20">
            <button (click)="logout()"
                class="w-full text-right px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                تسجيل الخروج
            </button>
        </div>
        }
    </div>
</header>
