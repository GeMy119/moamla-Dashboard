<div class="space-y-5 max-w-3xl">

    <div class="flex items-center gap-3">
        <button (click)="goBack()"
            class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <h1 class="text-xl font-bold text-gray-900">
            {{ isEditMode ? 'تعديل تأشيرة او استقدام عائلية' : 'إضافة تأشيرة او استقدام عائلية' }}
        </h1>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3">
        {{ errorMessage }}
    </div>

    <div *ngIf="isFetching" class="flex items-center justify-center py-20">
        <svg class="animate-spin h-7 w-7 text-indigo-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
    </div>

    <form *ngIf="!isFetching" (ngSubmit)="onSubmit()"
        class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- 🔹 قائمة اختيار العامل (تظهر فقط في وضع الإضافة إذا لم نكن داخل صفحة عامل معين) -->
        <div *ngIf="!workerIdFromUrl && !isEditMode"
            class="sm:col-span-2 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 mb-2">
            <label class="block text-sm font-semibold text-indigo-900 mb-1">اختيار العامل <span
                    class="text-red-500">*</span></label>
            <select name="worker_id" [(ngModel)]="formData.worker_id" required
                class="w-full px-3 py-2.5 bg-white border border-indigo-200 rounded-lg text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <option value="" disabled selected>-- اختر العامل من القائمة --</option>
                <option *ngFor="let worker of workersList" [value]="worker._id">
                    {{ worker.name }} - (رقم الإقامة: {{ worker.identity_number}})
                </option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">اسم الزائر</label>
            <input type="text" name="visitor_name" [(ngModel)]="formData.visitor_name" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">صلة القرابة</label>
            <input type="text" name="relation" [(ngModel)]="formData.relation" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">العمر</label>
            <input type="number" name="age" [(ngModel)]="formData.age" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">الجنسية</label>
            <input type="text" name="nationality" [(ngModel)]="formData.nationality" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">الغرض</label>
            <select name="purpose" [(ngModel)]="formData.purpose" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="familyVisit">زيارة عائلية</option>
                <option value="familyRecruitment">استقدام</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">مدة الإقامة (أيام)</label>
            <input type="number" name="duration_days" [(ngModel)]="formData.duration_days" required min="1"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">مدة الصلاحية (أيام)</label>
            <input type="number" name="validity_days" [(ngModel)]="formData.validity_days" min="1"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">مكان القدوم</label>
            <input type="text" name="arrival_from" [(ngModel)]="formData.arrival_from"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">حالة التأشيرة</label>
            <select name="status" [(ngModel)]="formData.status" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="approved">تمت الموافقة</option>
                <option value="rejected">تم الرفض</option>
                <option value="pending">قيد الانتظار</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">تاريخ الإصدار</label>
            <input type="text" name="releaseDate" [(ngModel)]="formData.releaseDate" required placeholder="YYYY-MM-DD"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="sm:col-span-2 flex items-center gap-3 pt-2">
            <button type="submit" [disabled]="isLoading"
                class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition disabled:opacity-50">
                {{ isLoading ? 'جارِ الحفظ...' : 'حفظ' }}
            </button>
            <button type="button" (click)="goBack()"
                class="text-gray-600 text-sm font-medium px-5 py-2.5 rounded-lg hover:bg-gray-50 transition">
                إلغاء
            </button>
        </div>
    </form>
</div>
