<div class="space-y-5">

    <!-- Header -->
    <div class="flex items-center gap-3">
        <button (click)="goBack()"
            class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <div>
            <h1 class="text-xl font-bold text-gray-900">
                {{ isEditMode ? 'تعديل بيانات الكفيل' : 'إضافة كفيل جديد' }}
            </h1>
            <p class="text-sm text-gray-500 mt-0.5">
                {{ isEditMode ? 'قم بتعديل البيانات ثم اضغط حفظ' : 'قم بملء البيانات التالية لإضافة كفيل جديد' }}
            </p>
        </div>
    </div>

    <!-- Fetching Loader -->
    <div *ngIf="isFetching" class="flex items-center justify-center py-20">
        <svg class="animate-spin h-7 w-7 text-indigo-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
    </div>

    <!-- Form Card -->
    <div *ngIf="!isFetching" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">

        <!-- Error -->
        <div *ngIf="errorMessage"
            class="mb-5 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 flex items-center gap-2">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <!-- الاسم -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الاسم</label>
                <input type="text" name="name" [(ngModel)]="formData.name" required
                    placeholder="معن أحمد ابن علي الغامدي"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" />
            </div>

            <!-- رقم الهوية -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رقم الهوية</label>
                <input type="text" name="identity_number" [(ngModel)]="formData.identity_number" required
                    placeholder="1234567890"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" />
            </div>

            <!-- رقم الملف -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رقم الملف</label>
                <input type="text" name="file_number" [(ngModel)]="formData.file_number" required
                    placeholder="1234567890"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" />
            </div>

            <!-- رقم المرجع -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رقم المرجع</label>
                <input type="text" name="reference_number" [(ngModel)]="formData.reference_number" required
                    placeholder="رقم المرجع"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" />
            </div>

            <!-- اسم الشركة -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">اسم الشركة</label>
                <input type="text" name="company_name" [(ngModel)]="formData.company_name" required
                    placeholder="مؤسسة معن أحمد..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" />
            </div>

            <!-- العنوان -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">العنوان</label>
                <input type="text" name="address" [(ngModel)]="formData.address" required
                    placeholder="الرياض، حي النزهة"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" />
            </div>

            <!-- Buttons -->
            <div class="md:col-span-2 flex items-center justify-end gap-3 pt-2 border-t border-gray-100 mt-2">
                <button type="button" (click)="goBack()"
                    class="px-5 py-2 text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                    إلغاء
                </button>
                <button type="submit" [disabled]="isLoading"
                    class="flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 rounded-lg transition">
                    <svg *ngIf="isLoading" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    {{ isLoading ? 'جاري الحفظ...' : isEditMode ? 'حفظ التعديلات' : 'إضافة الكفيل' }}
                </button>
            </div>

        </form>
    </div>
</div>
